      num_temporal_layers: 8
      
trainings:
  DINO:
    batch_size: 20
    num_epochs: 500
    learning_rate: 0.001
    seed: 42
    parallel_method: 'DistributedDataParallel'

  DINO_wo_OperatorEvolution:
    batch_size: 20
    num_epochs: 500
    learning_rate: 0.001
    seed: 42
    parallel_method: 'DistributedDataParallel'

  DINO_wo_MultiScaleProjection:
