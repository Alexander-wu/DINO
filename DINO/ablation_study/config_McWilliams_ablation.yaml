selected_model: 'IntegralOnlyDINO'

models:  

      
  DINO:
    parameters:
      shape_in: [1, 1, 128, 128] # T C H W
      spatial_hidden_dim: 128
      output_channels: 1
      temporal_hidden_dim: 256
      num_spatial_layers: 4
      num_temporal_layers: 8

  DINO_wo_OperatorEvolution:
    parameters:
      shape_in: [1, 1, 128, 128] # T C H W
      spatial_hidden_dim: 128
      output_channels: 1
      temporal_hidden_dim: 256
      num_spatial_layers: 4
      num_temporal_layers: 8

  DINO_wo_MultiScaleProjection:
    parameters:
      shape_in: [1, 1, 128, 128] # T C H W
      spatial_hidden_dim: 128
      output_channels: 1
      temporal_hidden_dim: 256
      num_spatial_layers: 4
      num_temporal_layers: 8

  DifferentialOnlyDINO:
    parameters:
      shape_in: [1, 1, 128, 128] # T C H W
      spatial_hidden_dim: 128
      output_channels: 1
      temporal_hidden_dim: 256
      num_spatial_layers: 4
      num_temporal_layers: 8

  IntegralOnlyDINO:
