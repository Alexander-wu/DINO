    learning_rate: 0.001
    seed: 42
    parallel_method: 'DistributedDataParallel'

  IntegralOnlyDINO:
    batch_size: 20
    num_epochs: 500
    learning_rate: 0.001
    seed: 42
    parallel_method: 'DistributedDataParallel'

